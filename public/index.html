<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trending Today</title>
<style>
  :root{
    --ink:#0E1B1A; --panel:#132927; --panel2:#0F211F; --line:#24413D;
    --wire:#E8A94A; --wire-dim:#8A6B3A; --text:#E7EDEA; --text-dim:#8FA6A0;
    --danger:#D96B5B;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--ink);color:var(--text);font-family:Georgia,'Iowan Old Style',serif;}
  .mono{font-family:'SF Mono',Menlo,Consolas,monospace;}
  #app{max-width:960px;margin:0 auto;padding:0 20px;}

  header{display:flex;align-items:baseline;justify-content:space-between;padding:28px 0 18px;border-bottom:1px solid var(--line);}
  header h1{font-size:26px;font-weight:400;margin:0;letter-spacing:0.3px;}
  header h1 span{color:var(--wire);}
  header .date{font-family:'SF Mono',Menlo,Consolas,monospace;font-size:12px;color:var(--text-dim);}
  header button{background:none;border:1px solid var(--line);color:var(--text-dim);padding:6px 12px;border-radius:2px;cursor:pointer;font-family:inherit;font-size:13px;}
  header button:hover{border-color:var(--wire-dim);color:var(--text);}

  /* auth */
  #auth{max-width:360px;margin:80px auto;padding:0 20px;}
  #auth h2{font-weight:400;font-size:22px;margin-bottom:4px;}
  #auth p.sub{color:var(--text-dim);font-size:14px;margin-top:0;margin-bottom:28px;}
  #auth input{width:100%;padding:10px 12px;margin-bottom:12px;background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:2px;font-family:inherit;font-size:15px;}
  #auth input:focus{outline:none;border-color:var(--wire-dim);}
  #auth button{width:100%;padding:11px;background:var(--wire);color:var(--ink);border:none;border-radius:2px;font-family:inherit;font-size:15px;cursor:pointer;font-weight:600;}
  #auth button:hover{background:#f0bb66;}
  #auth .switch{margin-top:16px;font-size:13px;color:var(--text-dim);}
  #auth .switch a{color:var(--wire);cursor:pointer;text-decoration:none;}
  #auth .error{color:var(--danger);font-size:13px;margin-bottom:12px;min-height:16px;}

  /* topic bar */
  #topicBar{display:flex;gap:8px;padding:20px 0;border-bottom:1px solid var(--line);}
  #topicBar input{flex:1;padding:10px 12px;background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:2px;font-family:inherit;font-size:15px;}
  #topicBar input:focus{outline:none;border-color:var(--wire-dim);}
  #topicBar button{padding:10px 18px;background:var(--wire);color:var(--ink);border:none;border-radius:2px;cursor:pointer;font-family:inherit;font-size:14px;font-weight:600;white-space:nowrap;}
  #topicBar button:hover{background:#f0bb66;}

  /* source filter */
  #filterBar{display:flex;flex-wrap:wrap;gap:8px;padding:16px 0;border-bottom:1px solid var(--line);}
  .filter-pill{padding:6px 14px;background:transparent;border:1px solid var(--line);color:var(--text-dim);border-radius:14px;cursor:pointer;font-family:'SF Mono',Menlo,Consolas,monospace;font-size:12px;white-space:nowrap;}
  .filter-pill:hover{border-color:var(--wire-dim);color:var(--text);}
  .filter-pill.active{background:var(--wire);border-color:var(--wire);color:var(--ink);font-weight:600;}
  .filter-pill.dormant{opacity:0.55;border-style:dashed;}
  .filter-pill.dormant.active{background:var(--panel2);border-color:var(--wire-dim);color:var(--wire-dim);opacity:1;}

  #main{display:none;padding:24px 0 60px;}
  #main.show{display:block;}

  .topic-block{margin-bottom:40px;}
  .topic-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
  .topic-head h2{font-size:22px;font-weight:400;margin:0;}
  .topic-head button{background:none;border:none;color:var(--text-dim);cursor:pointer;font-size:15px;}
  .topic-head button:hover{color:var(--danger);}

  .category{margin-bottom:22px;}
  .category h3{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--wire-dim);font-family:'SF Mono',Menlo,Consolas,monospace;font-weight:400;margin:0 0 8px;}
  .feed-item{padding:10px 0;border-bottom:1px solid var(--line);}
  .feed-item a{color:var(--text);text-decoration:none;font-size:17px;line-height:1.4;}
  .feed-item a:hover{color:var(--wire);}
  .feed-item .time{color:var(--text-dim);font-family:'SF Mono',Menlo,Consolas,monospace;font-size:11px;margin-left:8px;}
  .more-toggle{background:none;border:none;color:var(--wire-dim);cursor:pointer;font-family:'SF Mono',Menlo,Consolas,monospace;font-size:12px;padding:8px 0;}
  .more-toggle:hover{color:var(--wire);}
  .hidden-item{display:none;}
  .hidden-item.shown{display:block;}

  .empty{color:var(--text-dim);font-size:14px;padding:40px 0;text-align:center;font-family:'SF Mono',Menlo,Consolas,monospace;}
</style>
</head>
<body>

<div id="auth">
  <h2>Trending Today</h2>
  <p class="sub" id="authSub">Sign in to your daily wire.</p>
  <div class="error" id="authError"></div>
  <input type="email" id="email" placeholder="Email" autocomplete="email">
  <input type="password" id="password" placeholder="Password" autocomplete="current-password">
  <button id="authSubmit">Sign in</button>
  <div class="switch">No account yet? <a id="authSwitch">Create one</a></div>
</div>

<div id="app" style="display:none">
  <header>
    <h1>Trending <span>Today</span></h1>
    <div style="display:flex;align-items:center;gap:16px">
      <span class="date mono" id="today"></span>
      <button id="logout">Sign out</button>
    </div>
  </header>

  <div id="topicBar">
    <input type="text" id="topicInput" placeholder="Add a topic — e.g. agentic ai, space biology...">
    <button id="addTopic">Add topic</button>
  </div>

  <div id="filterBar"></div>

  <div id="main">
    <div id="feed"><div class="empty">Loading your feed…</div></div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
let mode = "login";

$('today').textContent = new Date().toLocaleDateString(undefined, { weekday:'long', year:'numeric', month:'long', day:'numeric' });

const CATEGORY_LABELS = {
  youtube: 'YouTube', github: 'GitHub', rss: 'News',
  twitter: 'Twitter/X', reddit: 'Reddit', bilibili: 'Bilibili', xhs: 'XiaoHongShu'
};
const ACTIVE_CATEGORIES = ['youtube', 'github', 'rss'];
const DORMANT_CATEGORIES = ['twitter', 'reddit', 'bilibili', 'xhs'];
let currentFilter = 'all';
let lastTopics = [];

function renderFilterBar() {
  const pill = (key, label, dormant) =>
    `<button class="filter-pill${dormant ? ' dormant' : ''}${currentFilter === key ? ' active' : ''}"
      onclick="setFilter('${key}')">${label}${dormant ? ' · soon' : ''}</button>`;
  $('filterBar').innerHTML =
    pill('all', 'All') +
    ACTIVE_CATEGORIES.map(c => pill(c, CATEGORY_LABELS[c], false)).join('') +
    DORMANT_CATEGORIES.map(c => pill(c, CATEGORY_LABELS[c], true)).join('');
}

window.setFilter = function(key) {
  currentFilter = key;
  renderFilterBar();
  renderFeed();
};

$('authSwitch').onclick = () => {
  mode = mode === "login" ? "signup" : "login";
  $('authSubmit').textContent = mode === "login" ? "Sign in" : "Create account";
  $('authSub').textContent = mode === "login" ? "Sign in to your daily wire." : "A few seconds to set up your feed.";
  $('authSwitch').parentElement.firstChild.textContent = mode === "login" ? "No account yet? " : "Already have one? ";
  $('authSwitch').textContent = mode === "login" ? "Create one" : "Sign in";
  $('authError').textContent = "";
};

$('authSubmit').onclick = async () => {
  const email = $('email').value.trim(), password = $('password').value;
  $('authError').textContent = "";
  const res = await fetch(`/api/auth/${mode === "login" ? "login" : "signup"}`, {
    method: "POST", headers: { "content-type": "application/json" },
    body: JSON.stringify({ email, password })
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    $('authError').textContent = err.error || "Something went wrong.";
    return;
  }
  boot();
};

$('logout').onclick = async () => {
  await fetch('/api/auth/logout', { method: 'POST' });
  location.reload();
};

$('addTopic').onclick = async () => {
  const keyword = $('topicInput').value.trim();
  if (!keyword) return;
  const btn = $('addTopic');
  const original = btn.textContent;
  btn.disabled = true;
  btn.textContent = 'Fetching…';
  await fetch('/api/topics', {
    method: 'POST', headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ keyword })
  });
  $('topicInput').value = '';
  await loadFeed();
  btn.disabled = false;
  btn.textContent = original;
};
$('topicInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('addTopic').click(); });

function timeAgo(ts) {
  if (!ts) return '';
  const mins = Math.floor((Date.now() - ts) / 60000);
  if (mins < 60) return `${mins}m ago`;
  if (mins < 1440) return `${Math.floor(mins/60)}h ago`;
  return `${Math.floor(mins/1440)}d ago`;
}

function renderCategory(type, items) {
  const label = CATEGORY_LABELS[type] || type;
  const visible = items.slice(0, 5);
  const rest = items.slice(5);
  const rowHtml = (i) => `
    <div class="feed-item">
      <a href="${i.url}" target="_blank" rel="noopener">${i.title}</a>
      <span class="time">${timeAgo(i.published_at)}</span>
    </div>`;
  const restId = `more-${type}-${Math.random().toString(36).slice(2,8)}`;
  return `
    <div class="category">
      <h3>${label}</h3>
      ${visible.map(rowHtml).join('')}
      ${rest.length ? `
        <div id="${restId}">${rest.map(i => `<div class="hidden-item">${rowHtml(i)}</div>`).join('')}</div>
        <button class="more-toggle" onclick="toggleMore('${restId}', this)">Show ${rest.length} more</button>
      ` : ''}
    </div>`;
}

window.toggleMore = function(id, btn) {
  const container = document.getElementById(id);
  const items = container.querySelectorAll('.hidden-item');
  const showing = items[0] && items[0].classList.contains('shown');
  items.forEach(el => el.classList.toggle('shown', !showing));
  btn.textContent = showing ? btn.textContent.replace('Hide', 'Show') : btn.textContent.replace('Show', 'Hide');
};

async function loadFeed() {
  const res = await fetch('/api/feed');
  lastTopics = await res.json();
  renderFeed();
}

function renderFeed() {
  const topics = lastTopics;
  if (!topics.length) {
    $('feed').innerHTML = '<div class="empty">No topics yet — add one above to start your feed.</div>';
    return;
  }
  $('feed').innerHTML = topics.map(t => {
    let body;
    if (currentFilter === 'all') {
      const categories = Object.keys(t.categories);
      body = categories.length
        ? categories.map(c => renderCategory(c, t.categories[c])).join('')
        : '<div class="empty" style="text-align:left;padding:8px 0">Nothing yet — fills in on the next daily run.</div>';
    } else if (DORMANT_CATEGORIES.includes(currentFilter)) {
      body = `<div class="empty" style="text-align:left;padding:8px 0">${CATEGORY_LABELS[currentFilter]} arrives in Phase 2 — coming soon.</div>`;
    } else {
      const items = t.categories[currentFilter];
      body = items && items.length
        ? renderCategory(currentFilter, items)
        : '<div class="empty" style="text-align:left;padding:8px 0">Nothing yet for this source — fills in on the next daily run.</div>';
    }
    return `
      <div class="topic-block">
        <div class="topic-head">
          <h2>${t.keyword}</h2>
          <button onclick="removeTopic('${t.keyword.replace(/'/g, "\\'")}')">✕ remove</button>
        </div>
        ${body}
      </div>`;
  }).join('');
}

window.removeTopic = async function(keyword) {
  await fetch('/api/topics', {
    method: 'DELETE', headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ keyword })
  });
  loadFeed();
};

async function boot() {
  const res = await fetch('/api/me');
  if (!res.ok) { $('auth').style.display = 'block'; $('app').style.display = 'none'; return; }
  $('auth').style.display = 'none';
  $('app').style.display = 'block';
  $('main').classList.add('show');
  renderFilterBar();
  loadFeed();
}

boot();
</script>
</body>
</html>
